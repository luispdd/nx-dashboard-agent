<div class="telemetry-chart-container relative rounded-xl border border-slate-800 bg-slate-900/60 p-4 shadow-xl backdrop-blur-sm">
  @if (isLoading()) {
    <div class="absolute inset-0 z-10 flex items-center justify-center rounded-xl bg-slate-950/70 backdrop-blur-xs">
      <div class="flex items-center gap-3 text-cyan-400">
        <svg class="h-6 w-6 animate-spin text-cyan-400" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span class="text-sm font-medium text-slate-300">Loading telemetry data...</span>
      </div>
    </div>
  }

  @if (hasData()) {
    <apx-chart
      [chart]="chart()"
      [series]="chartSeries()"
      [xaxis]="xaxis()"
      [yaxis]="yaxis()"
      [stroke]="stroke()"
      [fill]="fill()"
      [dataLabels]="dataLabels()"
      [tooltip]="tooltip()"
      [colors]="chartColors()"
      [markers]="markers()"
      [grid]="grid()"
      [legend]="legend()"
      [noData]="noData()"
    />
  } @else if (!isLoading()) {
    <div class="flex h-[380px] flex-col items-center justify-center text-slate-400">
      <svg class="mb-3 h-12 w-12 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <p class="text-base font-medium text-slate-300">No telemetry data recorded</p>
      <p class="text-sm text-slate-500">Adjust the time range or point count to display readings.</p>
    </div>
  }
</div>
