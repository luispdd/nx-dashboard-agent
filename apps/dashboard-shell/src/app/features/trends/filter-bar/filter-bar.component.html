<div class="bg-card border border-theme rounded-xl p-4 sm:p-5 shadow-xl space-y-4" data-testid="filter-bar">
  <!-- Top Row: Metric Pills and Sampling Mode -->
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
    <!-- Metric Pills Selector -->
    <div class="flex flex-wrap items-center gap-2" data-testid="metric-selector">
      <span class="text-xs font-semibold uppercase tracking-wider text-text-muted mr-1">Metric:</span>
      @for (m of metrics(); track m.metric_key) {
        <button
          type="button"
          (click)="selectMetric(m.metric_key)"
          class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 flex items-center gap-2 border cursor-pointer"
          [ngClass]="{
            'bg-accent/15 border-accent text-accent shadow-sm shadow-accent/20 font-semibold': selectedMetric() === m.metric_key,
            'bg-rail border-theme text-text-secondary hover:text-white hover:border-white/20': selectedMetric() !== m.metric_key
          }"
          [attr.data-testid]="'metric-pill-' + m.metric_key"
        >
          <span class="w-2 h-2 rounded-full" [style.backgroundColor]="m.color"></span>
          <span>{{ m.label }}</span>
          <span class="text-[10px] font-mono opacity-70">({{ m.unit }})</span>
        </button>
      }
    </div>

    <!-- Right Controls: Device Select & Sampling Toggle -->
    <div class="flex flex-wrap items-center gap-3">
      <!-- Device Dropdown -->
      <div class="flex items-center gap-2">
        <label for="deviceSelect" class="text-xs text-text-muted font-medium whitespace-nowrap">Device:</label>
        <select
          id="deviceSelect"
          [value]="selectedDevice()"
          (change)="onDeviceChange($event)"
          class="bg-rail border border-theme rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-accent transition-colors font-mono cursor-pointer"
          data-testid="device-select"
        >
          <option value="all">All Devices ({{ devices().length }})</option>
          @for (d of devices(); track d.device_id) {
            <option [value]="d.device_id">{{ d.device_id }}</option>
          }
        </select>
      </div>

      <!-- Sampling Toggle: Regular Only vs All Data -->
      <div class="flex items-center gap-2">
        <span class="text-xs text-text-muted font-medium whitespace-nowrap">Sampling:</span>
        <div class="inline-flex rounded-lg border border-theme bg-rail p-0.5" role="group" data-testid="sampling-toggle">
          <button
            type="button"
            (click)="setRegularOnly(true)"
            class="px-2.5 py-1 text-xs rounded-md transition-colors cursor-pointer"
            [ngClass]="{
              'bg-accent/20 text-accent font-semibold': regularOnly(),
              'text-text-muted hover:text-white': !regularOnly()
            }"
            data-testid="sampling-regular-btn"
          >
            Regular Only
          </button>
          <button
            type="button"
            (click)="setRegularOnly(false)"
            class="px-2.5 py-1 text-xs rounded-md transition-colors cursor-pointer"
            [ngClass]="{
              'bg-accent/20 text-accent font-semibold': !regularOnly(),
              'text-text-muted hover:text-white': regularOnly()
            }"
            data-testid="sampling-all-btn"
          >
            All Data
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="h-px bg-divider"></div>

  <!-- Two-Line Mutually Exclusive Button Groups -->
  <div class="space-y-2.5">
    <!-- Line 1: Time Range Presets -->
    <div class="flex flex-wrap items-center gap-1.5" data-testid="time-range-group">
      <span class="text-xs font-semibold uppercase tracking-wider text-text-muted w-24 shrink-0">Time Range:</span>
      @for (opt of timeRangeOptions; track opt.value) {
        <button
          type="button"
          (click)="selectRange(opt.value)"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition-all duration-150 border cursor-pointer font-mono"
          [ngClass]="{
            'bg-accent/20 border-accent text-accent font-semibold shadow-xs': selectedRange() === opt.value,
            'bg-rail border-theme text-text-muted hover:text-white hover:border-white/20': selectedRange() !== opt.value
          }"
          [attr.data-testid]="'range-btn-' + opt.value"
        >
          {{ opt.label }}
        </button>
      }
    </div>

    <!-- Line 2: Latest Points Presets -->
    <div class="flex flex-wrap items-center gap-1.5" data-testid="points-group">
      <span class="text-xs font-semibold uppercase tracking-wider text-text-muted w-24 shrink-0">Latest Points:</span>
      @for (pts of pointOptions; track pts) {
        <button
          type="button"
          (click)="selectPoints(pts)"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition-all duration-150 border cursor-pointer font-mono"
          [ngClass]="{
            'bg-accent/20 border-accent text-accent font-semibold shadow-xs': selectedPoints() === pts,
            'bg-rail border-theme text-text-muted hover:text-white hover:border-white/20': selectedPoints() !== pts
          }"
          [attr.data-testid]="'points-btn-' + pts"
        >
          {{ pts }} pts
        </button>
      }
    </div>
  </div>
</div>
