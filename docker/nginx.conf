events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Port 4200: Angular Dashboard Shell SPA ---
    server {
        listen 4200;
        listen [::]:4200;
        server_name localhost;
        root /usr/share/nginx/html/shell;
        index index.html;

        # Client-side SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy to NestJS Dashboard API
        location /api/ {
            proxy_pass http://dashboard-api:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100M;
        }
    }

    # --- Port 4204: React Chat Microfrontend (CORS enabled) ---
    server {
        listen 4204;
        listen [::]:4204;
        server_name localhost;
        root /usr/share/nginx/html/chat;
        index index.html;

        # Permissive CORS headers for Native Federation remote modules and chunks
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            try_files $uri $uri/ =404;
        }
    }
}
