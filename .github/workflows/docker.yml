name: Docker Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          echo "CONFIG_ENCRYPTION_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          chmod -R 777 data

      - name: Build Docker images
        run: docker compose build

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify service status
        run: docker compose ps

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v
